<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Petaurino</title>

<style>
* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

body {
    margin: 0;
    background: #f4ead8;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    color: #49392d;
    overflow-x: hidden;
}

.app {
    width: 100%;
    max-width: 480px;
    margin: auto;
    min-height: 100vh;
    background: #fffaf2;
    overflow: hidden;
}

/* HEADER */
header {
    padding: 18px 18px 12px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.logo {
    font-size: 25px;
    font-weight: 800;
    color: #6d5038;
}

.subtitle {
    font-size: 12px;
    color: #9a806a;
    margin-top: 2px;
}

/* STATS */
.stats {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 7px;
    padding: 0 12px 12px;
}

.stat {
    background: #f4eadb;
    border-radius: 15px;
    padding: 8px 4px;
    text-align: center;
}

.stat-icon { font-size: 17px; }
.stat-name { font-size: 9px; color: #907764; margin-top: 1px; }
.stat-value { font-size: 13px; font-weight: 800; margin-top: 2px; }

/* STANZA */
.room {
    position: relative;
    height: 410px;
    margin: 0 12px;
    border-radius: 24px;
    overflow: hidden;
    background:
        linear-gradient(
            to bottom,
            #b8d99b 0%,
            #a9d18a 58%,
            #7eae69 58%,
            #6d985d 100%
        );
    box-shadow: inset 0 0 0 2px rgba(255,255,255,.3);
}

.room::before {
    content: "";
    position: absolute;
    width: 180px;
    height: 180px;
    right: -50px;
    top: -60px;
    border-radius: 50%;
    background: rgba(255,255,220,.35);
    filter: blur(15px);
}

/* RAMI / TRONCHI */
.branch {
    position: absolute;
    height: 18px;
    border-radius: 20px;
    background: #735039;
    transform-origin: left center;
    z-index: 2;
    pointer-events: none;
}

.branch.one {
    width: 230px;
    left: -30px;
    top: 55px;
    transform: rotate(7deg);
}

.branch.two {
    width: 180px;
    right: -35px;
    top: 105px;
    transform: rotate(-8deg);
}

/* Corde dell'amaca */
.hammock-rope {
    position: absolute;
    width: 3px;
    height: 68px;
    background: #8b694c;
    border-radius: 3px;
    z-index: 4;
    pointer-events: none;
}

.hammock-rope.left {
    left: 53px;
    top: 89px;
    transform: rotate(-13deg);
}

.hammock-rope.right {
    left: 137px;
    top: 100px;
    height: 59px;
    transform: rotate(14deg);
}

/* FOGLIE */
.leaf {
    position: absolute;
    width: 25px;
    height: 15px;
    border-radius: 100% 0 100% 0;
    background: #638d50;
    z-index: 3;
    pointer-events: none;
}

.leaf.l1 { left: 45px; top: 70px; transform: rotate(-30deg); }
.leaf.l2 { left: 95px; top: 45px; transform: rotate(25deg); }
.leaf.l3 { right: 65px; top: 110px; transform: rotate(30deg); }
.leaf.l4 { right: 125px; top: 80px; transform: rotate(-25deg); }

/* OGGETTI */
.object {
    position: absolute;
    z-index: 8;
    user-select: none;
    -webkit-user-select: none;
    cursor: pointer;
    touch-action: manipulation;
    transition: transform .15s ease;
}

.object:active { transform: scale(.94); }

.object img {
    width: 100%;
    height: auto;
    display: block;
    pointer-events: none;
}

.hammock {
    left: 30px;
    top: 137px;
    width: 105px;
}

.hideout {
    right: 18px;
    bottom: 55px;
    width: 95px;
}

.plant {
    left: 25px;
    bottom: 45px;
    width: 60px;
}

.ball {
    right: 105px;
    bottom: 35px;
    width: 40px;
}

.food {
    left: 145px;
    bottom: 32px;
    width: 38px;
}

/* SANDRINA */
.sandrine {
    position: absolute;
    width: 85px;
    height: 85px;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    z-index: 20;
    cursor: grab;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
    transition: left .15s linear, top .15s linear;
}

.sandrine img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: block;
    pointer-events: none;
}

.sandrine.idle {
    animation: breathe 2.2s ease-in-out infinite;
}

.sandrine.walking {
    animation: walkBounce .36s ease-in-out infinite alternate;
}

.sandrine.cuddle {
    animation: cuddle .5s ease-in-out infinite alternate;
}

.sandrine.sleepy {
    animation: sleepy 1s ease-in-out infinite alternate;
}

.sandrine.clean {
    animation: cleanBounce .35s ease-in-out infinite alternate;
}

.sandrine.playing {
    animation: playing .4s ease-in-out infinite alternate;
}

.sandrine.eating {
    animation: eating .35s ease-in-out infinite alternate;
}

.sandrine.hiding {
    animation: hiding .7s ease-in-out infinite alternate;
}

.sandrine.exploring {
    animation: exploring .6s ease-in-out infinite alternate;
}

.sandrine.dragging {
    animation: none !important;
    transition: none !important;
    cursor: grabbing;
    z-index: 100;
}

/* ANIMAZIONI */
@keyframes breathe {
    0%,100% { transform: translate(-50%, -50%) scale(1); }
    50% { transform: translate(-50%, -53%) scale(1.025); }
}

@keyframes walkBounce {
    from { margin-top: 0; }
    to { margin-top: -5px; }
}

@keyframes cuddle {
    from { transform: translate(0,0) scale(1); }
    to { transform: translate(0,0) scale(1.12); }
}

@keyframes sleepy {
    from { transform: translate(0,0) scale(1); }
    to { transform: translate(0,5px) scale(.95); }
}

@keyframes cleanBounce {
    from { transform: translate(0,0) rotate(-5deg); }
    to { transform: translate(0,0) rotate(5deg); }
}

@keyframes playing {
    from { transform: translate(0,0) rotate(-6deg) scale(1); }
    to { transform: translate(0,-7px) rotate(6deg) scale(1.05); }
}

@keyframes eating {
    from { transform: translate(0,0) scale(1); }
    to { transform: translate(0,2px) scale(.95); }
}

@keyframes hiding {
    from { transform: translate(0,0) scale(1); }
    to { transform: translate(8px,0) scale(.85); }
}

@keyframes exploring {
    from { transform: translate(0,0) rotate(-4deg); }
    to { transform: translate(0,-4px) rotate(4deg); }
}

/* DIALOGO */
.speech {
    min-height: 50px;
    margin: 12px 12px 5px;
    padding: 13px 15px;
    background: #f7efe3;
    border-radius: 17px;
    text-align: center;
    font-size: 14px;
    font-weight: 600;
    color: #665243;
}

.status {
    text-align: center;
    min-height: 20px;
    padding: 2px 15px 7px;
    font-size: 11px;
    color: #9a806a;
}

/* AZIONI */
.actions {
    display: grid;
    grid-template-columns: repeat(5,1fr);
    gap: 6px;
    padding: 5px 12px 10px;
}

.action {
    border: none;
    border-radius: 14px;
    padding: 10px 2px;
    font-size: 10px;
    font-weight: 800;
    color: white;
    cursor: pointer;
    box-shadow: 0 3px 0 rgba(0,0,0,.12);
}

.action:active {
    transform: translateY(3px);
    box-shadow: none;
}

.feed-button { background: #d99a55; }
.play-button { background: #76a85d; }
.cuddle-button { background: #d47d9d; }
.sleep-button { background: #7f83b8; }
.clean-button { background: #70b5cc; }

/* DIARIO */
.diary {
    margin: 4px 12px 20px;
    padding: 14px;
    background: #faf4eb;
    border-radius: 18px;
    border: 1px solid rgba(115,93,74,.08);
}

.diary-title {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 13px;
    font-weight: 800;
    margin-bottom: 9px;
    color: #735d4a;
}

.diary-subtitle {
    font-size: 9px;
    color: #ad9681;
    margin-top: -5px;
    margin-bottom: 7px;
}

.diary-list {
    max-height: 145px;
    overflow-y: auto;
}

.diary-entry {
    display: flex;
    gap: 8px;
    align-items: flex-start;
    font-size: 10px;
    color: #8f7864;
    padding: 7px 0;
    border-bottom: 1px solid rgba(130,100,70,.08);
}

.diary-entry:last-child {
    border-bottom: none;
}

.diary-time {
    min-width: 35px;
    font-size: 9px;
    color: #b29b87;
    padding-top: 1px;
}

.diary-text {
    flex: 1;
}

/* EFFETTI */
.effect {
    position: absolute;
    z-index: 50;
    font-size: 30px;
    pointer-events: none;
    animation: effectPop 1s ease forwards;
}

@keyframes effectPop {
    0% {
        opacity: 0;
        transform: translateY(15px) scale(.4);
    }
    25% {
        opacity: 1;
        transform: translateY(0) scale(1.15);
    }
    100% {
        opacity: 0;
        transform: translateY(-45px) scale(.8);
    }
}

@media (max-width: 360px) {
    .room { height: 370px; }
    .sandrine { width: 75px; height: 75px; }
    .action { font-size: 9px; }
}

/* =====================================================
   TEXTURE NATURALE
===================================================== */

.room {
    background:
        radial-gradient(circle at 15% 25%, rgba(255,255,255,.14) 0 1px, transparent 1.5px),
        radial-gradient(circle at 72% 18%, rgba(60,90,45,.10) 0 1px, transparent 1.5px),
        radial-gradient(circle at 35% 72%, rgba(255,255,255,.10) 0 1px, transparent 1.5px),
        linear-gradient(
            to bottom,
            #b8d99b 0%,
            #a9d18a 58%,
            #7eae69 58%,
            #6d985d 100%
        );
    background-size: 34px 34px, 47px 47px, 61px 61px, 100% 100%;
}

.room::after {
    content: "";
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    height: 42%;
    z-index: 1;
    pointer-events: none;
    opacity: .28;
    background:
        repeating-linear-gradient(
            102deg,
            transparent 0 13px,
            rgba(55,80,42,.12) 14px 16px,
            transparent 17px 29px
        );
}

/* Il pavimento è una zona distinta */
.room::before {
    z-index: 0;
}

/* I rami sono piattaforme, non pavimento */
.branch {
    cursor: pointer;
    pointer-events: auto;
    box-shadow:
        inset 0 3px 0 rgba(255,255,255,.08),
        inset 0 -4px 0 rgba(65,40,25,.14);
}

.branch::after {
    content: "";
    position: absolute;
    inset: 4px 12px;
    border-radius: 20px;
    background:
        repeating-linear-gradient(
            90deg,
            rgba(255,255,255,.05) 0 3px,
            transparent 3px 17px
        );
    pointer-events: none;
}

.branch.two::after {
    inset: 4px 10px;
}

/* Salto */
.sandrine.jumping {
    animation: jump 650ms cubic-bezier(.2,.75,.35,1) forwards !important;
}

@keyframes jump {
    0% {
        transform: translate(0,0) scaleX(var(--direction,1)) rotate(0);
    }
    35% {
        transform: translate(0,-58px) scaleX(var(--direction,1)) rotate(-7deg);
    }
    70% {
        transform: translate(0,-70px) scaleX(var(--direction,1)) rotate(7deg);
    }
    100% {
        transform: translate(0,0) scaleX(var(--direction,1)) rotate(0);
    }
}

.floor-shadow {
    position: absolute;
    z-index: 5;
    width: 55px;
    height: 10px;
    border-radius: 50%;
    background: rgba(45,65,35,.18);
    filter: blur(3px);
    pointer-events: none;
    transition: left .15s linear, top .15s linear;
}

</style>
</head>

<body>

<div class="app">

<header>
    <div>
        <div class="logo">Petaurino</div>
        <div class="subtitle">La piccola Sandrina</div>
    </div>
    <div style="font-size:24px;">🐾</div>
</header>

<div class="stats">

    <div class="stat">
        <div class="stat-icon">🍎</div>
        <div class="stat-name">Fame</div>
        <div class="stat-value" id="hungerValue">80</div>
    </div>

    <div class="stat">
        <div class="stat-icon">❤️</div>
        <div class="stat-name">Felicità</div>
        <div class="stat-value" id="happinessValue">90</div>
    </div>

    <div class="stat">
        <div class="stat-icon">⚡</div>
        <div class="stat-name">Energia</div>
        <div class="stat-value" id="energyValue">70</div>
    </div>

    <div class="stat">
        <div class="stat-icon">🫧</div>
        <div class="stat-name">Pulizia</div>
        <div class="stat-value" id="cleanValue">85</div>
    </div>

</div>

<div class="room" id="room">

    <div class="branch one"></div>
    <div class="branch two"></div>

    <div class="leaf l1"></div>
    <div class="leaf l2"></div>
    <div class="leaf l3"></div>
    <div class="leaf l4"></div>

    <!-- CORDE AMACA -->
    <div class="hammock-rope left"></div>
    <div class="hammock-rope right"></div>

    <!-- AMACA -->
    <div class="object hammock" id="hammock">
        <img src="images/hammock.png" alt="Amaca">
    </div>

    <!-- RIFUGIO -->
    <div class="object hideout" id="hideout">
        <img src="images/hideout.png" alt="Rifugio">
    </div>

    <!-- PIANTA -->
    <div class="object plant" id="plant">
        <img src="images/plant.png" alt="Pianta">
    </div>

    <!-- PALLA -->
    <div class="object ball" id="ball">
        <img src="images/ball.png" alt="Palla">
    </div>

    <!-- CIBO -->
    <div class="object food" id="food">
        <img src="images/food.png" alt="Cibo">
    </div>

    <!-- OMBRA DI SANDRINA -->
    <div class="floor-shadow" id="floorShadow"></div>

    <!-- SANDRINA -->
    <div class="sandrine idle" id="sandrine">
        <img id="sandrineImage" src="images/sandrina-idle.png" alt="Sandrina">
    </div>

</div>

<div class="speech" id="speech">
    Ciao! Sono Sandrina.
</div>

<div class="status" id="status">
    Sandrina sta esplorando la stanza...
</div>

<div class="actions">

    <button class="action feed-button" onclick="feed()">
        🍎<br>CIBO
    </button>

    <button class="action play-button" onclick="play()">
        ⚽<br>GIOCA
    </button>

    <button class="action cuddle-button" onclick="cuddle()">
        ❤️<br>COCCOLE
    </button>

    <button class="action sleep-button" onclick="sleep()">
        💤<br>NANNA
    </button>

    <button class="action clean-button" onclick="cleanSandrina()">
        🫧<br>PULISCI
    </button>

</div>

<div class="diary">

    <div class="diary-title">
        📖 Diario di Sandrina
    </div>

    <div class="diary-subtitle">
        Piccole cose successe oggi...
    </div>

    <div class="diary-list" id="diaryList"></div>

</div>

</div>

<script>

/* =====================================================
   STATO
===================================================== */

let game = {
    hunger: 80,
    happiness: 90,
    energy: 70,
    clean: 85,
    lastUpdate: Date.now(),
    diary: []
};


/* =====================================================
   ELEMENTI
===================================================== */

const sandrine = document.getElementById("sandrine");
const sandrineImage = document.getElementById("sandrineImage");
const room = document.getElementById("room");
const speech = document.getElementById("speech");
const statusText = document.getElementById("status");
const floorShadow = document.getElementById("floorShadow");


/* =====================================================
   FRASE RANDOM
===================================================== */

const phrases = {

    idle: [
        "Che si fa?",
        "Mi annoio un pochino.",
        "Mmm... dove potrei andare?",
        "Ho appena avuto un'idea. Non so quale.",
        "Questa stanza è enorme.",
        "Ho trovato una cosa interessante.",
        "Secondo me qui succede qualcosa.",
        "Mi faccio un giretto.",
        "Pssst... ci sei?",
        "Sto esplorando.",
        "Non sto combinando niente. Giuro.",
        "Forse dovrei fare un pisolino.",
        "Ho voglia di giocare.",
        "Chissà cosa c'è lì.",
        "Eccomi qua."
    ],

    food: [
        "CIBOOOO!",
        "Finalmente qualcuno pensa a me.",
        "GNAM GNAM GNAM.",
        "Questo profumino lo sentivo da lontano.",
        "Ne voglio ancora.",
        "Era proprio quello che mi serviva.",
        "Mangiare è una grande invenzione.",
        "Ok, questo era buono."
    ],

    play: [
        "PALLA!",
        "Prendimi se ci riesci!",
        "Questa è mia.",
        "Guarda come corro!",
        "Ancora! Ancora!",
        "Sono velocissima.",
        "Non mi stanco mai. Quasi.",
        "La palla non scappa da me."
    ],

    cuddle: [
        "Ok... queste mi piacciono.",
        "Ancora cinque minuti.",
        "Mmmh. Continua.",
        "Questa cosa delle coccole è bellissima.",
        "Mi hai conquistata.",
        "Va bene, puoi tenermi così.",
        "Non mi muovo più.",
        "Questo posto è comodo."
    ],

    sleep: [
        "Zzz... finalmente.",
        "Buonanotte... credo.",
        "Io mi ritiro.",
        "Cinque minuti e dormo.",
        "Mmm... amaca.",
        "Questa è vita.",
        "Non svegliatemi.",
        "Zzz... non sto russando."
    ],

    clean: [
        "Che bella pulita!",
        "Ok, ora luccico.",
        "Non era proprio necessario... però mi piace.",
        "Profumo di Sandrina pulita.",
        "Sono nuova!",
        "Adesso posso combinare altri disastri.",
        "Splendente.",
        "Bagnetto fatto!"
    ],

    plant: [
        "Cos'è questa?",
        "Mmm... interessante.",
        "Questa pianta mi osserva.",
        "Secondo me qui vive qualcuno.",
        "Posso mangiarla?",
        "No? Peccato.",
        "Annuso e basta.",
        "Ho trovato un posto interessante."
    ],

    branch: [
        "Che salto!",
        "Da qui vedo tutto.",
        "Questo ramo è mio.",
        "Un giretto qui sopra.",
        "Eheheh, ce l'ho fatta.",
        "Quanto è bello quassù.",
        "Salto riuscito!",
        "Ok, ora scendo."
    ],

    hide: [
        "Non mi trovi.",
        "Shhh...",
        "Sono invisibile.",
        "Qui non c'è nessuno.",
        "Eheheh.",
        "Ti ho fregato.",
        "Questo è il mio nascondiglio segreto.",
        "Non dire dove sono."
    ],

    drag: [
        "Ehi! Mi hai spostata!",
        "Oh! Dove mi porti?",
        "Aspetta, non ero pronta!",
        "Taxi Sandrina.",
        "Ok, va bene.",
        "Mi piace questo nuovo posto.",
        "Che trasloco improvviso."
    ]
};


function randomPhrase(type) {

    const list = phrases[type] || phrases.idle;

    return list[
        Math.floor(
            Math.random() * list.length
        )
    ];
}


/* =====================================================
   UTILITÀ
===================================================== */

function clamp(value) {

    return Math.max(
        0,
        Math.min(
            100,
            value
        )
    );
}


function saveGame() {

    game.lastUpdate = Date.now();

    localStorage.setItem(
        "petaurino",
        JSON.stringify(game)
    );
}


function setSpeech(text) {
    speech.textContent = text;
}


function setStatus(text) {
    statusText.textContent = text;
}


/* =====================================================
   CARICAMENTO
===================================================== */

function loadGame() {

    const saved =
        localStorage.getItem("petaurino");

    if (!saved) return;

    try {

        const data =
            JSON.parse(saved);

        game = {
            ...game,
            ...data
        };

    } catch(error) {

        console.log(
            "Errore nel salvataggio."
        );

    }
}


/* =====================================================
   UI
===================================================== */

function updateUI() {

    document.getElementById(
        "hungerValue"
    ).textContent =
        Math.round(game.hunger);

    document.getElementById(
        "happinessValue"
    ).textContent =
        Math.round(game.happiness);

    document.getElementById(
        "energyValue"
    ).textContent =
        Math.round(game.energy);

    document.getElementById(
        "cleanValue"
    ).textContent =
        Math.round(game.clean);

    updateStatus();
    updateDiary();
}


function updateStatus() {

    if (game.hunger < 20) {

        setStatus(
            "🍎 Sandrina ha parecchia fame."
        );

        return;
    }

    if (game.energy < 20) {

        setStatus(
            "💤 Sandrina è stanchissima."
        );

        return;
    }

    if (game.clean < 20) {

        setStatus(
            "🫧 Sandrina avrebbe bisogno di una pulita."
        );

        return;
    }

    if (game.happiness < 25) {

        setStatus(
            "❤️ Sandrina vuole attenzioni."
        );

        return;
    }

    setStatus(
        "Sandrina sta esplorando la stanza..."
    );
}


/* =====================================================
   DIARIO
===================================================== */

function addDiary(text, icon = "🐾") {

    const now =
        new Date();

    const time =
        now.toLocaleTimeString(
            "it-IT",
            {
                hour: "2-digit",
                minute: "2-digit"
            }
        );

    game.diary.unshift({
        time: time,
        text: text,
        icon: icon
    });

    if (game.diary.length > 30) {
        game.diary =
            game.diary.slice(0,30);
    }

    updateDiary();
    saveGame();
}


function updateDiary() {

    const list =
        document.getElementById(
            "diaryList"
        );

    list.innerHTML = "";

    if (!game.diary.length) {

        const empty =
            document.createElement("div");

        empty.className =
            "diary-entry";

        empty.innerHTML =
            '<div class="diary-time">—</div>' +
            '<div class="diary-text">Il diario è ancora vuoto. Sandrina deve combinare qualcosa.</div>';

        list.appendChild(empty);

        return;
    }

    game.diary
        .slice(0,12)
        .forEach(entry => {

            let time = "";
            let text = "";
            let icon = "🐾";

            if (typeof entry === "string") {

                const parts =
                    entry.split(" — ");

                time =
                    parts[0] || "";

                text =
                    parts.slice(1).join(" — ") || entry;

                icon = "🐾";

            } else {

                time = entry.time || "";
                text = entry.text || "";
                icon = entry.icon || "🐾";

            }

            const div =
                document.createElement("div");

            div.className =
                "diary-entry";

            div.innerHTML =
                `<div>${icon}</div>
                 <div class="diary-time">${time}</div>
                 <div class="diary-text">${text}</div>`;

            list.appendChild(div);

        });
}

/* =====================================================
   CAMMINATA
===================================================== */

const walkFrames = [
    "images/sandrina-walk-1.png",
    "images/sandrina-walk-2.png",
    "images/sandrina-walk-3.png",
    "images/sandrina-walk-4.png"
];

let walkInterval = null;
let walkingTimeout = null;
let movingToObject = false;
let draggingSandrina = false;
let dragged = false;


function startWalkingAnimation() {

    stopWalkingAnimation();

    let frame = 0;

    walkInterval =
        setInterval(() => {

            sandrineImage.src =
                walkFrames[frame];

            frame =
                (frame + 1) %
                walkFrames.length;

        },180);
}


function stopWalkingAnimation() {

    if (walkInterval) {

        clearInterval(
            walkInterval
        );

        walkInterval = null;

    }
}


function stopMovement() {

    stopWalkingAnimation();

    if (walkingTimeout) {

        clearTimeout(
            walkingTimeout
        );

        walkingTimeout = null;

    }

    movingToObject = false;
}


/* =====================================================
   RITORNO A IDLE
===================================================== */

function returnToIdleAndWalk(delay = 1800) {

    setTimeout(() => {

        if (
            draggingSandrina ||
            movingToObject
        ) {

            return;

        }

        sandrine.className =
            "sandrine idle";

        sandrineImage.src =
            "images/sandrina-idle.png";

        setTimeout(() => {

            if (
                !draggingSandrina &&
                !movingToObject
            ) {

                moveSandrina();

            }

        }, delay);

    }, 600);
}



/* =====================================================

function updateFloorShadow() {

    if (!floorShadow) return;

    const x =
        sandrine.offsetLeft +
        sandrine.offsetWidth / 2 -
        27;

    const floorY =
        Math.max(
            room.clientHeight * .58 + 3,
            sandrine.offsetTop +
            sandrine.offsetHeight -
            8
        );

    floorShadow.style.left =
        `${x}px`;

    floorShadow.style.top =
        `${floorY}px`;
}


/* =====================================================
   SALTO SU UN RAMO
===================================================== */

function jumpToBranch(branch) {

    stopMovement();

    movingToObject = true;

    const rect =
        branch.getBoundingClientRect();

    const roomRect =
        room.getBoundingClientRect();

    const targetX =
        rect.left -
        roomRect.left +
        (
            rect.width -
            sandrine.offsetWidth
        ) / 2;

    /*
       Il punto di arrivo è sopra il ramo,
       non dentro il ramo.
    */
    const targetY =
        rect.top -
        roomRect.top -
        sandrine.offsetHeight +
        5;

    const direction =
        targetX >= sandrine.offsetLeft
            ? 1
            : -1;

    setSpeech(
        "Aspetta... salto!"
    );

    setStatus(
        "🐾 Sandrina sta saltando sul ramo..."
    );

    /*
       Prima cammina sul pavimento fino
       alla verticale del ramo.
    */
    const floorTop =
        room.clientHeight * .58;

    const approachY =
        Math.max(
            floorTop + 8,
            sandrine.offsetTop
        );

    walkTo(
        targetX,
        approachY,
        () => {

            stopWalkingAnimation();

            sandrine.className =
                "sandrine jumping";

            if (floorShadow) {
                floorShadow.style.opacity = "0";
            }

            sandrine.style.setProperty(
                "--direction",
                direction
            );

            sandrine.style.transform =
                `translate(0,0) scaleX(${direction})`;

            createEffect(
                "✨",
                sandrine.offsetLeft + 25,
                sandrine.offsetTop - 10
            );

            setTimeout(
                () => {

                    /*
                       Posizione finale sul ramo.
                    */
                    sandrine.className =
                        "sandrine idle";

                    sandrineImage.src =
                        "images/sandrina-idle.png";

                    sandrine.style.left =
                        `${targetX}px`;

                    sandrine.style.top =
                        `${targetY}px`;

                    setStatus(
                        "🌿 Sandrina è sul ramo."
                    );

                    setSpeech(
                        randomPhrase("branch")
                    );

                    createEffect(
                        "🍃",
                        targetX + 25,
                        targetY - 10
                    );

                    addDiary(
                        "Sandrina ha fatto un salto sul ramo.",
                        "🌿"
                    );

                    /*
                       Dopo una breve pausa torna
                       giù sul pavimento.
                    */
                    setTimeout(
                        () => {

                            if (
                                !draggingSandrina
                            ) {

                                const floorY =
                                    room.clientHeight -
                                    sandrine.offsetHeight -
                                    18;

                                sandrine.className =
                                    "sandrine jumping";

                                sandrine.style.top =
                                    `${floorY}px`;

                                setTimeout(
                                    () => {

                                        movingToObject =
                                            false;

                                        sandrine.className =
                                            "sandrine idle";

                                        sandrineImage.src =
                                            "images/sandrina-idle.png";

                                        if (floorShadow) {
                                            floorShadow.style.opacity = "1";
                                        }

                                        updateFloorShadow();

                                        setStatus(
                                            "🐾 Sandrina è tornata sul pavimento."
                                        );

                                        setTimeout(
                                            moveSandrina,
                                            1200
                                        );

                                    },
                                    650
                                );

                            }

                        },
                        1800
                    );

                },
                650
            );

        }
    );
}

/* =====================================================

===================================================== */

function getObjectTarget(
    element,
    offsetX = 0,
    offsetY = 0
) {

    return {

        x:
            element.offsetLeft +
            (
                element.offsetWidth -
                sandrine.offsetWidth
            ) / 2 +
            offsetX,

        y:
            element.offsetTop +
            (
                element.offsetHeight -
                sandrine.offsetHeight
            ) / 2 +
            offsetY

    };
}


/* =====================================================
   CAMMINA VERSO UN PUNTO
===================================================== */

function walkTo(
    targetX,
    targetY,
    callback
) {

    stopMovement();

    movingToObject = true;

    const startX =
        sandrine.offsetLeft;

    const startY =
        sandrine.offsetTop;

    const dx =
        targetX - startX;

    const dy =
        targetY - startY;

    const distance =
        Math.sqrt(
            dx * dx +
            dy * dy
        );

    const direction =
        dx >= 0 ? 1 : -1;

    const duration =
        Math.max(
            900,
            Math.min(
                2800,
                distance * 7
            )
        );

    sandrine.className =
        "sandrine walking";

    sandrine.style.transform =
        `translate(0,0) scaleX(${direction})`;

    startWalkingAnimation();

    sandrine.style.transition =
        `left ${duration}ms linear, top ${duration}ms linear`;

    requestAnimationFrame(() => {

        sandrine.style.left =
            `${targetX}px`;

        sandrine.style.top =
            `${targetY}px`;

    });

    walkingTimeout =
        setTimeout(() => {

            stopWalkingAnimation();

            movingToObject = false;

            sandrine.style.transition =
                "left .15s linear, top .15s linear";

            if (callback) {
                callback();
            }

        },duration + 60);
}

/* =====================================================
   TRASCINAMENTO
===================================================== */

let dragOffsetX = 0;
let dragOffsetY = 0;


sandrine.addEventListener(
    "pointerdown",
    startDrag
);

document.addEventListener(
    "pointermove",
    dragSandrina,
    { passive: false }
);

document.addEventListener(
    "pointerup",
    endDrag
);


function startDrag(e) {

    e.preventDefault();

    draggingSandrina = true;
    dragged = false;

    stopMovement();

    const rect =
        sandrine.getBoundingClientRect();

    dragOffsetX =
        e.clientX -
        rect.left;

    dragOffsetY =
        e.clientY -
        rect.top;

    sandrine.classList.add(
        "dragging"
    );

    if (sandrine.setPointerCapture) {

        try {

            sandrine.setPointerCapture(
                e.pointerId
            );

        } catch(error) {}

    }
}


function dragSandrina(e) {

    if (!draggingSandrina) {
        return;
    }

    e.preventDefault();

    dragged = true;

    const roomRect =
        room.getBoundingClientRect();

    let x =
        e.clientX -
        roomRect.left -
        dragOffsetX;

    let y =
        e.clientY -
        roomRect.top -
        dragOffsetY;

    const maxX =
        room.clientWidth -
        sandrine.offsetWidth;

    const floorTop =
        room.clientHeight * .58;

    const minY =
        floorTop + 8;

    const maxY =
        room.clientHeight -
        sandrine.offsetHeight -
        18;

    x =
        Math.max(
            0,
            Math.min(
                maxX,
                x
            )
        );

    y =
        Math.max(
            minY,
            Math.min(
                maxY,
                y
            )
        );

    sandrine.style.transition =
        "none";

    sandrine.style.left =
        `${x}px`;

    sandrine.style.top =
        `${y}px`;

    sandrine.style.transform =
        "translate(0,0)";

    updateFloorShadow();

    sandrineImage.src =
        "images/sandrina-idle.png";
}


function endDrag() {

    if (!draggingSandrina) {
        return;
    }

    draggingSandrina = false;

    sandrine.classList.remove(
        "dragging"
    );

    sandrine.style.transition =
        "left .15s linear, top .15s linear";

    if (dragged) {

        setSpeech(
            randomPhrase("drag")
        );

        setStatus(
            "👆 Sandrina è stata spostata."
        );

        createEffect(
            "✨",
            sandrine.offsetLeft + 25,
            sandrine.offsetTop - 10
        );

        addDiary(
            "Sandrina è stata trascinata in un nuovo posto.",
            "👆"
        );

        saveGame();

        returnToIdleAndWalk();

    }
}

/* =====================================================
   MOVIMENTO AUTONOMO
===================================================== */

function moveSandrina() {

    if (
        draggingSandrina ||
        movingToObject
    ) {
        return;
    }

    stopWalkingAnimation();

    const roomWidth =
        room.clientWidth;

    const roomHeight =
        room.clientHeight;

    const sandrinaWidth =
        sandrine.offsetWidth;

    const sandrinaHeight =
        sandrine.offsetHeight;

    /*
       Sandrina cammina SOLO sul pavimento.
       Il pavimento inizia circa al 58% della stanza.
       I rami sono quindi "piattaforme" raggiungibili
       solo tramite salto.
    */

    const floorTop =
        roomHeight * .58;

    const marginX = 15;

    const floorPaddingTop = 8;
    const floorPaddingBottom = 18;

    const minY =
        floorTop +
        floorPaddingTop;

    const maxY =
        roomHeight -
        sandrinaHeight -
        floorPaddingBottom;

    const maxX =
        roomWidth -
        sandrinaWidth -
        marginX;

    const x =
        marginX +
        Math.random() *
        Math.max(
            1,
            maxX - marginX
        );

    const y =
        minY +
        Math.random() *
        Math.max(
            1,
            maxY - minY
        );

    const currentX =
        sandrine.offsetLeft;

    const currentY =
        sandrine.offsetTop;

    const direction =
        x >= currentX ? 1 : -1;

    const distance =
        Math.sqrt(
            Math.pow(
                x - currentX,
                2
            ) +
            Math.pow(
                y - currentY,
                2
            )
        );

    const duration =
        Math.max(
            1400,
            Math.min(
                3500,
                distance * 7
            )
        );

    sandrine.className =
        "sandrine walking";

    sandrine.style.setProperty(
        "--direction",
        direction
    );

    sandrine.style.transform =
        `translate(0,0) scaleX(${direction})`;

    startWalkingAnimation();

    sandrine.style.transition =
        `left ${duration}ms linear, top ${duration}ms linear`;

    requestAnimationFrame(() => {

        sandrine.style.left =
            `${x}px`;

        sandrine.style.top =
            `${y}px`;

        updateFloorShadow();

    });

    walkingTimeout =
        setTimeout(
            () => {

                stopWalkingAnimation();

                if (
                    !draggingSandrina &&
                    !movingToObject
                ) {

                    sandrine.className =
                        "sandrine idle";

                    sandrine.style.transition =
                        "left .15s linear, top .15s linear";

                    sandrineImage.src =
                        "images/sandrina-idle.png";

                    updateFloorShadow();

                    if (
                        Math.random() < .45
                    ) {

                        setSpeech(
                            randomPhrase("idle")
                        );

                    }

                }

                const pause =
                    1800 +
                    Math.random() *
                    4500;

                walkingTimeout =
                    setTimeout(
                        moveSandrina,
                        pause
                    );

            },
            duration + 50
        );
}


 /* =====================================================
   EVENTI CASUALI
===================================================== */

function randomEvent() {

    if (
        draggingSandrina ||
        movingToObject
    ) {
        return;
    }

    const events = [

        () => {

            setSpeech(
                "Oh! Una foglia."
            );

            setStatus(
                "🍃 Sandrina ha trovato qualcosa."
            );

            createEffect(
                "🍃"
            );

            addDiary(
                "Sandrina ha trovato una foglia.",
                "🍃"
            );

        },

        () => {

            setSpeech(
                "Pssst... ci sei?"
            );

            setStatus(
                "👀 Sandrina vuole attenzioni."
            );

            createEffect(
                "❤️"
            );

        },

        () => {

            setSpeech(
                "Secondo me quella palla mi sta guardando."
            );

            setStatus(
                "⚽ Sandrina ha idee strane."
            );

            createEffect(
                "❓"
            );

        },

        () => {

            setSpeech(
                "Ho sonno."
            );

            setStatus(
                "💤 Sandrina sta pensando a un pisolino."
            );

            createEffect(
                "💤"
            );

        }

    ];

    const event =
        events[
            Math.floor(
                Math.random() *
                events.length
            )
        ];

    event();

    saveGame();
    updateUI();
}


/* =====================================================
   TEMPO
===================================================== */

function updateTime() {

    const now =
        Date.now();

    const elapsed =
        now -
        game.lastUpdate;

    const tenMinutes =
        10 * 60 * 1000;

    if (
        elapsed <
        tenMinutes
    ) {
        return;
    }

    const periods =
        Math.floor(
            elapsed /
            tenMinutes
        );

    game.hunger =
        clamp(
            game.hunger -
            periods
        );

    game.happiness =
        clamp(
            game.happiness -
            periods * .5
        );

    game.energy =
        clamp(
            game.energy -
            periods * .5
        );

    game.clean =
        clamp(
            game.clean -
            periods
        );

    game.lastUpdate =
        now;

    saveGame();
    updateUI();
}


/* =====================================================
   AVVIO
===================================================== */

loadGame();
updateTime();
updateUI();
setupBranches();
updateFloorShadow();


setTimeout(
    () => {
        moveSandrina();
    },
    1800
);


setInterval(
    updateTime,
    2 * 60 * 1000
);


setInterval(
    () => {

        if (
            Math.random() < .35
        ) {

            randomEvent();

        }

    },
    45000
);

</script>
