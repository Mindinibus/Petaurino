<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Petaurino</title>

<style>

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

body {
    margin: 0;
    background: #f4ead8;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    color: #49392d;
    overflow-x: hidden;
}

.app {
    width: 100%;
    max-width: 480px;
    margin: auto;
    min-height: 100vh;
    background: #fffaf2;
    overflow: hidden;
}

/* =========================
   HEADER
========================= */

header {
    padding: 18px 18px 12px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.logo {
    font-size: 25px;
    font-weight: 800;
    color: #6d5038;
}

.subtitle {
    font-size: 12px;
    color: #9a806a;
    margin-top: 2px;
}

/* =========================
   STATS
========================= */

.stats {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 7px;
    padding: 0 12px 12px;
}

.stat {
    background: #f4eadb;
    border-radius: 15px;
    padding: 8px 4px;
    text-align: center;
}

.stat-icon {
    font-size: 17px;
}

.stat-name {
    font-size: 9px;
    color: #907764;
    margin-top: 1px;
}

.stat-value {
    font-size: 13px;
    font-weight: 800;
    margin-top: 2px;
}

/* =========================
   ROOM
========================= */

.room {
    position: relative;
    height: 410px;
    margin: 0 12px;
    border-radius: 24px;
    overflow: hidden;

    background:
        linear-gradient(
            to bottom,
            #b8d99b 0%,
            #a9d18a 58%,
            #7eae69 58%,
            #6d985d 100%
        );

    box-shadow: inset 0 0 0 2px rgba(255,255,255,.3);
}

/* luce */

.room::before {
    content: "";
    position: absolute;
    width: 180px;
    height: 180px;
    right: -50px;
    top: -60px;
    border-radius: 50%;
    background: rgba(255,255,220,.35);
    filter: blur(15px);
}

/* ramo */

.branch {
    position: absolute;
    height: 18px;
    border-radius: 20px;
    background: #735039;
    transform-origin: left center;
    z-index: 2;
}

.branch.one {
    width: 210px;
    left: -30px;
    top: 55px;
    transform: rotate(7deg);
}

.branch.two {
    width: 180px;
    right: -35px;
    top: 105px;
    transform: rotate(-8deg);
}

/* foglie */

.leaf {
    position: absolute;
    width: 25px;
    height: 15px;
    border-radius: 100% 0 100% 0;
    background: #638d50;
    z-index: 3;
}

.leaf.l1 {
    left: 45px;
    top: 70px;
    transform: rotate(-30deg);
}

.leaf.l2 {
    left: 95px;
    top: 45px;
    transform: rotate(25deg);
}

.leaf.l3 {
    right: 65px;
    top: 110px;
    transform: rotate(30deg);
}

.leaf.l4 {
    right: 125px;
    top: 80px;
    transform: rotate(-25deg);
}

/* =========================
   OBJECTS
========================= */

.object {
    position: absolute;
    z-index: 5;
    user-select: none;
    pointer-events: none;
}

.hammock {
    left: 20px;
    top: 145px;
    width: 115px;
}

.hideout {
    right: 18px;
    bottom: 55px;
    width: 95px;
}

.plant {
    left: 25px;
    bottom: 45px;
    width: 60px;
}

.ball {
    right: 105px;
    bottom: 35px;
    width: 40px;
}

.food {
    left: 145px;
    bottom: 32px;
    width: 38px;
}

/* se alcune immagini non esistono,
   le immagini vengono comunque nascoste */

.object img {
    width: 100%;
    height: auto;
    display: block;
}

/* =========================
   FLOOR
========================= */

.floor-detail {
    position: absolute;
    width: 100%;
    height: 2px;
    background: rgba(255,255,255,.15);
    bottom: 72px;
}

/* =========================
   SANDRINA
========================= */

.sandrine {
    position: absolute;

    width: 85px;
    height: 85px;

    left: 50%;
    top: 50%;

    transform: translate(-50%, -50%);

    z-index: 20;

    cursor: pointer;

    transition:
        left .2s linear,
        top .2s linear,
        transform .2s linear;
}

.sandrine img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: block;
    pointer-events: none;
}

.sandrine.idle {
    animation: breathe 2.2s ease-in-out infinite;
}

.sandrine.walking {
    animation: walkBounce .36s ease-in-out infinite alternate;
}

.sandrine.happy {
    animation: happy .55s ease-in-out infinite alternate;
}

.sandrine.cuddle {
    animation: cuddle .5s ease-in-out infinite alternate;
}

.sandrine.sleepy {
    animation: sleepy 1s ease-in-out infinite alternate;
}

.sandrine.clean {
    animation: cleanBounce .35s ease-in-out infinite alternate;
}

@keyframes breathe {
    0%,100% {
        transform: translate(-50%, -50%) scale(1);
    }

    50% {
        transform: translate(-50%, -53%) scale(1.025);
    }
}

@keyframes walkBounce {
    from {
        margin-top: 0;
    }

    to {
        margin-top: -5px;
    }
}

@keyframes happy {
    from {
        transform: translate(-50%, -50%) rotate(-5deg) scale(1);
    }

    to {
        transform: translate(-50%, -55%) rotate(5deg) scale(1.08);
    }
}

@keyframes cuddle {
    from {
        transform: translate(-50%, -50%) scale(1);
    }

    to {
        transform: translate(-50%, -50%) scale(1.12);
    }
}

@keyframes sleepy {
    from {
        transform: translate(-50%, -50%) scale(1);
    }

    to {
        transform: translate(-50%, -45%) scale(.95);
    }
}

@keyframes cleanBounce {
    from {
        transform: translate(-50%, -50%) rotate(-5deg);
    }

    to {
        transform: translate(-50%, -50%) rotate(5deg);
    }
}

/* =========================
   SPEECH
========================= */

.speech {
    min-height: 50px;
    margin: 12px 12px 5px;
    padding: 13px 15px;

    background: #f7efe3;
    border-radius: 17px;

    text-align: center;
    font-size: 14px;
    font-weight: 600;

    color: #665243;
}

.status {
    text-align: center;
    min-height: 20px;
    padding: 2px 15px 7px;

    font-size: 11px;
    color: #9a806a;
}

/* =========================
   ACTIONS
========================= */

.actions {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 6px;
    padding: 5px 12px 10px;
}

.action {
    border: none;
    border-radius: 14px;

    padding: 10px 2px;

    font-size: 10px;
    font-weight: 800;

    color: white;

    cursor: pointer;

    box-shadow: 0 3px 0 rgba(0,0,0,.12);

    transition:
        transform .1s,
        filter .1s;
}

.action:active {
    transform: translateY(3px);
    box-shadow: none;
    filter: brightness(.94);
}

.feed-button {
    background: #d99a55;
}

.play-button {
    background: #76a85d;
}

.cuddle-button {
    background: #d47d9d;
}

.sleep-button {
    background: #7f83b8;
}

.clean-button {
    background: #70b5cc;
}

/* =========================
   DIARY
========================= */

.diary {
    margin: 4px 12px 20px;
    padding: 12px;

    background: #faf4eb;
    border-radius: 17px;
}

.diary-title {
    font-size: 12px;
    font-weight: 800;
    margin-bottom: 7px;
    color: #735d4a;
}

.diary-list {
    max-height: 115px;
    overflow-y: auto;
}

.diary-entry {
    font-size: 10px;
    color: #8f7864;
    padding: 4px 0;
    border-bottom: 1px solid rgba(130,100,70,.08);
}

/* =========================
   EFFECTS
========================= */

.effect {
    position: absolute;
    z-index: 50;

    font-size: 30px;

    pointer-events: none;

    animation: effectPop 1s ease forwards;
}

@keyframes effectPop {

    0% {
        opacity: 0;
        transform: translateY(15px) scale(.4);
    }

    25% {
        opacity: 1;
        transform: translateY(0) scale(1.15);
    }

    100% {
        opacity: 0;
        transform: translateY(-45px) scale(.8);
    }
}

/* =========================
   MOBILE
========================= */

@media (max-width: 360px) {

    .room {
        height: 370px;
    }

    .sandrine {
        width: 75px;
        height: 75px;
    }

    .action {
        font-size: 9px;
    }
}

</style>
</head>

<body>

<div class="app">

    <!-- HEADER -->

    <header>

        <div>
            <div class="logo">Petaurino</div>
            <div class="subtitle">La piccola Sandrina</div>
        </div>

        <div style="font-size:24px;">
            🐾
        </div>

    </header>


    <!-- STATS -->

    <div class="stats">

        <div class="stat">
            <div class="stat-icon">🍎</div>
            <div class="stat-name">Fame</div>
            <div class="stat-value" id="hungerValue">80</div>
        </div>

        <div class="stat">
            <div class="stat-icon">❤️</div>
            <div class="stat-name">Felicità</div>
            <div class="stat-value" id="happinessValue">90</div>
        </div>

        <div class="stat">
            <div class="stat-icon">⚡</div>
            <div class="stat-name">Energia</div>
            <div class="stat-value" id="energyValue">70</div>
        </div>

        <div class="stat">
            <div class="stat-icon">🫧</div>
            <div class="stat-name">Pulizia</div>
            <div class="stat-value" id="cleanValue">85</div>
        </div>

    </div>


    <!-- ROOM -->

    <div class="room" id="room">

        <div class="branch one"></div>
        <div class="branch two"></div>

        <div class="leaf l1"></div>
        <div class="leaf l2"></div>
        <div class="leaf l3"></div>
        <div class="leaf l4"></div>


        <!-- AMACA -->

        <div class="object hammock">
            <img src="images/hammock.png" alt="">
        </div>


        <!-- RIFUGIO -->

        <div class="object hideout">
            <img src="images/hideout.png" alt="">
        </div>


        <!-- PIANTA -->

        <div class="object plant">
            <img src="images/plant.png" alt="">
        </div>


        <!-- PALLA -->

        <div class="object ball">
            <img src="images/ball.png" alt="">
        </div>


        <!-- CIBO -->

        <div class="object food">
            <img src="images/food.png" alt="">
        </div>


        <div class="floor-detail"></div>


        <!-- SANDRINA -->

        <div
            class="sandrine idle"
            id="sandrine"
            onclick="petSandrina()"
        >

            <img
                id="sandrineImage"
                src="images/sandrina-idle.png"
                alt="Sandrina"
            >

        </div>

    </div>


    <!-- SPEECH -->

    <div class="speech" id="speech">
        Ciao! Sono Sandrina.
    </div>


    <div class="status" id="status">
        Sandrina sta guardando cosa succede...
    </div>


    <!-- ACTIONS -->

    <div class="actions">

        <button
            class="action feed-button"
            onclick="feed()"
        >
            🍎<br>CIBO
        </button>

        <button
            class="action play-button"
            onclick="play()"
        >
            ⚽<br>GIOCA
        </button>

        <button
            class="action cuddle-button"
            onclick="cuddle()"
        >
            ❤️<br>COCCOLE
        </button>

        <button
            class="action sleep-button"
            onclick="sleep()"
        >
            💤<br>NANNA
        </button>

        <button
            class="action clean-button"
            onclick="cleanSandrina()"
        >
            🫧<br>PULISCI
        </button>

    </div>


    <!-- DIARY -->

    <div class="diary">

        <div class="diary-title">
            📖 Diario di Sandrina
        </div>

        <div
            class="diary-list"
            id="diaryList"
        ></div>

    </div>

</div>


<script>

/* =========================================
   STATO DEL GIOCO
========================================= */

let game = {

    hunger: 80,
    happiness: 90,
    energy: 70,
    clean: 85,

    lastUpdate: Date.now(),

    diary: []

};


/* =========================================
   ELEMENTI
========================================= */

const sandrine =
    document.getElementById("sandrine");

const sandrineImage =
    document.getElementById("sandrineImage");

const room =
    document.getElementById("room");

const speech =
    document.getElementById("speech");

const statusText =
    document.getElementById("status");


/* =========================================
   CARICAMENTO
========================================= */

function loadGame() {

    const saved =
        localStorage.getItem("petaurino");

    if (!saved) return;

    try {

        const data =
            JSON.parse(saved);

        game = {
            ...game,
            ...data
        };

    } catch (error) {

        console.log(
            "Salvataggio non leggibile."
        );

    }

}


/* =========================================
   SALVATAGGIO
========================================= */

function saveGame() {

    game.lastUpdate = Date.now();

    localStorage.setItem(
        "petaurino",
        JSON.stringify(game)
    );

}


/* =========================================
   LIMITI
========================================= */

function clamp(value) {

    return Math.max(
        0,
        Math.min(100, value)
    );

}


/* =========================================
   UI
========================================= */

function updateUI() {

    document.getElementById(
        "hungerValue"
    ).textContent =
        Math.round(game.hunger);

    document.getElementById(
        "happinessValue"
    ).textContent =
        Math.round(game.happiness);

    document.getElementById(
        "energyValue"
    ).textContent =
        Math.round(game.energy);

    document.getElementById(
        "cleanValue"
    ).textContent =
        Math.round(game.clean);

    updateStatus();

    updateDiary();

}


/* =========================================
   SPEECH
========================================= */

function setSpeech(text) {

    speech.textContent = text;

}


/* =========================================
   STATUS
========================================= */

function setStatus(text) {

    statusText.textContent = text;

}


function showStatus() {

    updateStatus();

}


function updateStatus() {

    if (game.hunger < 20) {

        setStatus(
            "🍎 Sandrina ha parecchia fame."
        );

        return;
    }

    if (game.energy < 20) {

        setStatus(
            "💤 Sandrina è stanchissima."
        );

        return;
    }

    if (game.clean < 20) {

        setStatus(
            "🫧 Sandrina avrebbe proprio bisogno di una pulita."
        );

        return;
    }

    if (game.happiness < 25) {

        setStatus(
            "❤️ Sandrina vuole un po' di attenzioni."
        );

        return;
    }

    setStatus(
        "Sandrina sta esplorando la stanza..."
    );

}


/* =========================================
   DIARIO
========================================= */

function addDiary(text) {

    const now =
        new Date();

    const time =
        now.toLocaleTimeString(
            "it-IT",
            {
                hour: "2-digit",
                minute: "2-digit"
            }
        );

    game.diary.unshift(
        `${time} — ${text}`
    );

    if (game.diary.length > 20) {

        game.diary =
            game.diary.slice(0, 20);

    }

    updateDiary();

    saveGame();

}


function updateDiary() {

    const list =
        document.getElementById(
            "diaryList"
        );

    list.innerHTML = "";

    game.diary
        .slice(0, 10)
        .forEach(entry => {

            const div =
                document.createElement("div");

            div.className =
                "diary-entry";

            div.textContent =
                entry;

            list.appendChild(div);

        });

}


/* =========================================
   EFFETTI
========================================= */

function createEffect(
    emoji,
    x = null,
    y = null
) {

    const effect =
        document.createElement("div");

    effect.className =
        "effect";

    effect.textContent =
        emoji;

    if (x === null) {

        x =
            sandrine.offsetLeft +
            sandrine.offsetWidth / 2;

    }

    if (y === null) {

        y =
            sandrine.offsetTop;

    }

    effect.style.left =
        `${x}px`;

    effect.style.top =
        `${y}px`;

    room.appendChild(effect);

    setTimeout(() => {

        effect.remove();

    }, 1000);

}


/* =========================================
   ANIMAZIONE SANDRINA
========================================= */

function animateSandrina(type) {

    stopWalkingAnimation();

    let image =
        "images/sandrina-idle.png";

    if (type === "happy") {

        image =
            "images/sandrina-happy.png";

    }

    if (type === "cuddle") {

        image =
            "images/sandrina-cuddle.png";

    }

    if (type === "sleep") {

        image =
            "images/sandrina-sleep.png";

    }

    if (type === "clean") {

        image =
            "images/sandrina-clean.png";

    }

    if (type === "play") {

        image =
            "images/sandrina-play.png";

    }

    if (type === "eating") {

        image =
            "images/sandrina-eating.png";

    }

    sandrineImage.src =
        image;

    sandrine.className =
        "sandrine " + type;

    setTimeout(() => {

        sandrine.className =
            "sandrine idle";

        sandrineImage.src =
            "images/sandrina-idle.png";

    }, 1200);

}


/* =========================================
   CAREZZE DIRETTE
========================================= */

function petSandrina() {

    game.happiness =
        clamp(game.happiness + 3);

    game.energy =
        clamp(game.energy - 1);

    setSpeech(
        "Ehehe... ancora coccole."
    );

    setStatus(
        "❤️ Sandrina sembra apprezzare."
    );

    createEffect("❤️");

    saveGame();
    updateUI();

}


/* =========================================
   CIBO
========================================= */

function feed() {

    game.hunger =
        clamp(game.hunger + 25);

    game.happiness =
        clamp(game.happiness + 4);

    game.clean =
        clamp(game.clean - 2);

    setSpeech(
        "GNAM GNAM! Era mia."
    );

    setStatus(
        "🍎 Sandrina ha mangiato."
    );

    animateSandrina(
        "eating"
    );

    createEffect("🍎");
    createEffect("✨");

    addDiary(
        "🍎 Sandrina ha fatto uno spuntino."
    );

    saveGame();
    updateUI();

}


/* =========================================
   GIOCA
========================================= */

function play() {

    if (game.energy < 10) {

        setSpeech(
            "Vorrei giocare... ma sono cotta."
        );

        setStatus(
            "💤 Sandrina è troppo stanca."
        );

        return;
    }

    game.happiness =
        clamp(game.happiness + 18);

    game.energy =
        clamp(game.energy - 12);

    game.clean =
        clamp(game.clean - 3);

    setSpeech(
        "GIOCHIAMO!"
    );

    setStatus(
        "⚽ Sandrina sta giocando."
    );

    animateSandrina(
        "play"
    );

    createEffect("⚡");
    createEffect("✨");

    addDiary(
        "⚽ Avete giocato con Sandrina."
    );

    saveGame();
    updateUI();

}


/* =========================================
   COCCOLE
========================================= */

function cuddle() {

    game.happiness =
        clamp(game.happiness + 15);

    game.energy =
        clamp(game.energy - 3);

    setSpeech(
        "Ok... queste mi piacciono."
    );

    setStatus(
        "❤️ Sandrina si è lasciata coccolare."
    );

    animateSandrina(
        "cuddle"
    );

    createEffect("❤️");
    createEffect("💕");

    addDiary(
        "❤️ Sandrina ha ricevuto tante coccole."
    );

    saveGame();
    updateUI();

}


/* =========================================
   NANNA
========================================= */

function sleep() {

    game.energy =
        clamp(game.energy + 30);

    game.hunger =
        clamp(game.hunger - 5);

    setSpeech(
        "Zzz... non stavo dormendo."
    );

    setStatus(
        "💤 Sandrina si è fatta una bella dormita."
    );

    animateSandrina(
        "sleep"
    );

    createEffect("💤");

    addDiary(
        "💤 Sandrina ha fatto una pennichella."
    );

    saveGame();
    updateUI();

}


/* =========================================
   PULIZIA
========================================= */

function cleanSandrina() {

    game.clean =
        clamp(game.clean + 25);

    game.happiness =
        clamp(game.happiness + 5);

    setSpeech(
        "Che bella pulita!"
    );

    setStatus(
        "🧼 Avete fatto il bagnetto a Sandrina."
    );

    animateSandrina(
        "clean"
    );

    createEffect("🫧");
    createEffect("✨");

    addDiary(
        "🧼 Sandrina è stata pulita."
    );

    saveGame();
    updateUI();

}


/* =========================================
   CAMMINATA
========================================= */

const walkFrames = [

    "images/sandrina-walk-1.png",
    "images/sandrina-walk-2.png",
    "images/sandrina-walk-3.png",
    "images/sandrina-walk-4.png"

];

let walkInterval = null;
let walkingTimeout = null;


function startWalkingAnimation() {

    stopWalkingAnimation();

    let frame = 0;

    walkInterval =
        setInterval(() => {

            sandrineImage.src =
                walkFrames[frame];

            frame =
                (frame + 1) %
                walkFrames.length;

        }, 180);

}


function stopWalkingAnimation() {

    if (walkInterval) {

        clearInterval(
            walkInterval
        );

        walkInterval = null;

    }

}


function moveSandrina() {

    if (walkingTimeout) {

        clearTimeout(
            walkingTimeout
        );

    }

    const roomWidth =
        room.clientWidth;

    const roomHeight =
        room.clientHeight;

    const sandrinaWidth =
        sandrine.offsetWidth;

    const sandrinaHeight =
        sandrine.offsetHeight;


    const marginX = 20;
    const marginY = 35;


    const maxX =
        roomWidth -
        sandrinaWidth -
        marginX;

    const maxY =
        roomHeight -
        sandrinaHeight -
        marginY;


    const x =
        marginX +
        Math.random() *
        Math.max(1, maxX - marginX);

    const y =
        marginY +
        Math.random() *
        Math.max(1, maxY - marginY);


    const currentX =
        sandrine.offsetLeft;

    const direction =
        x > currentX
            ? 1
            : -1;


    sandrine.className =
        "sandrine walking";

    sandrine.style.left =
        `${x}px`;

    sandrine.style.top =
        `${y}px`;

    sandrine.style.transform =
        `translate(0, 0) scaleX(${direction})`;

    startWalkingAnimation();


    const distance =
        Math.abs(x - currentX) +
        Math.abs(y - sandrine.offsetTop);


    const duration =
        Math.max(
            1800,
            Math.min(
                4000,
                distance * 8
            )
        );


    walkingTimeout =
        setTimeout(() => {

            stopWalkingAnimation();

            sandrine.className =
                "sandrine idle";

            sandrine.style.transform =
                "translate(-50%, -50%)";

            sandrineImage.src =
                "images/sandrina-idle.png";


            const pause =
                1500 +
                Math.random() * 4000;


            walkingTimeout =
                setTimeout(
                    moveSandrina,
                    pause
                );

        }, duration);

}


/* =========================================
   EVENTI CASUALI
========================================= */

function randomEvent() {

    const events = [

        () => {

            setSpeech(
                "Oh! Una foglia."
            );

            setStatus(
                "🍃 Sandrina ha trovato qualcosa."
            );

            createEffect("🍃");

            addDiary(
                "🍃 Sandrina ha trovato una foglia."
            );

        },

        () => {

            setSpeech(
                "Non mi vedi."
            );

            setStatus(
                "🙈 Sandrina si è nascosta."
            );

            createEffect("❓");

            addDiary(
                "🙈 Sandrina ha deciso di nascondersi."
            );

        },

        () => {

            setSpeech(
                "Quello era mio."
            );

            setStatus(
                "🍪 Sandrina ha rubato qualcosa."
            );

            createEffect("🍪");

            addDiary(
                "🍪 Sandrina ha combinato un piccolo furto."
            );

        },

        () => {

            setSpeech(
                "Ehi! Mi considerate?"
            );

            setStatus(
                "👀 Sandrina vuole attenzioni."
            );

            createEffect("❤️");

        }

    ];


    const event =
        events[
            Math.floor(
                Math.random() *
                events.length
            )
        ];

    event();

    saveGame();
    updateUI();

}


/* =========================================
   TEMPO
========================================= */

function updateTime() {

    const now =
        Date.now();

    const elapsed =
        now -
        game.lastUpdate;


    const tenMinutes =
        10 * 60 * 1000;


    if (elapsed < tenMinutes) {

        return;

    }


    const periods =
        Math.floor(
            elapsed /
            tenMinutes
        );


    game.hunger =
        clamp(
            game.hunger -
            periods * 1
        );


    game.happiness =
        clamp(
            game.happiness -
            periods * .5
        );


    game.energy =
        clamp(
            game.energy -
            periods * .5
        );


    game.clean =
        clamp(
            game.clean -
            periods * 1
        );


    game.lastUpdate =
        now;


    saveGame();
    updateUI();

}


/* =========================================
   RESET
========================================= */

function resetGame() {

    const confirmReset =
        confirm(
            "Vuoi davvero ricominciare da zero?"
        );

    if (!confirmReset) return;


    localStorage.removeItem(
        "petaurino"
    );


    game = {

        hunger: 80,
        happiness: 90,
        energy: 70,
        clean: 85,

        lastUpdate: Date.now(),

        diary: []

    };


    setSpeech(
        "Ciao! Sono Sandrina."
    );

    setStatus(
        "Sandrina è pronta per ricominciare."
    );

    updateUI();

}


/* =========================================
   AVVIO
========================================= */

loadGame();

updateTime();

updateUI();


/* prima camminata */

setTimeout(() => {

    moveSandrina();

}, 1800);


/* tempo */

setInterval(
    updateTime,
    2 * 60 * 1000
);


/* eventi casuali */

setInterval(() => {

    if (
        Math.random() <
        0.35
    ) {

        randomEvent();

    }

}, 45000);


</script>
