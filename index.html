<!DOCTYPE html>
<html lang="it">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Petaurino</title>

<style>

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

body {
    margin: 0;
    background: #f4ead8;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    color: #49392d;
    overflow-x: hidden;
}

.app {
    width: 100%;
    max-width: 480px;
    margin: auto;
    min-height: 100vh;
    background: #fffaf2;
    overflow: hidden;
}

/* HEADER */

header {
    padding: 18px 18px 12px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.logo {
    font-size: 25px;
    font-weight: 800;
    color: #6d5038;
}

.subtitle {
    font-size: 12px;
    color: #9a806a;
    margin-top: 2px;
}


/* STATS */

.stats {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 7px;
    padding: 0 12px 12px;
}

.stat {
    background: #f4eadb;
    border-radius: 15px;
    padding: 8px 4px;
    text-align: center;
}

.stat-icon {
    font-size: 17px;
}

.stat-name {
    font-size: 9px;
    color: #907764;
    margin-top: 1px;
}

.stat-value {
    font-size: 13px;
    font-weight: 800;
    margin-top: 2px;
}


/* STANZA */

.room {
    position: relative;
    height: 410px;
    margin: 0 12px;
    border-radius: 24px;
    overflow: hidden;

    background:
        linear-gradient(
            to bottom,
            #b8d99b 0%,
            #a9d18a 58%,
            #7eae69 58%,
            #6d985d 100%
        );

    box-shadow:
        inset 0 0 0 2px rgba(255,255,255,.3);
}

.room::before {
    content: "";
    position: absolute;
    width: 180px;
    height: 180px;
    right: -50px;
    top: -60px;
    border-radius: 50%;
    background: rgba(255,255,220,.35);
    filter: blur(15px);
}


/* RAMI */

.branch {
    position: absolute;
    height: 18px;
    border-radius: 20px;
    background: #735039;
    transform-origin: left center;
    z-index: 2;
    pointer-events: none;
}

.branch.one {
    width: 210px;
    left: -30px;
    top: 55px;
    transform: rotate(7deg);
}

.branch.two {
    width: 180px;
    right: -35px;
    top: 105px;
    transform: rotate(-8deg);
}


/* FOGLIE */

.leaf {
    position: absolute;
    width: 25px;
    height: 15px;
    border-radius: 100% 0 100% 0;
    background: #638d50;
    z-index: 3;
    pointer-events: none;
}

.leaf.l1 {
    left: 45px;
    top: 70px;
    transform: rotate(-30deg);
}

.leaf.l2 {
    left: 95px;
    top: 45px;
    transform: rotate(25deg);
}

.leaf.l3 {
    right: 65px;
    top: 110px;
    transform: rotate(30deg);
}

.leaf.l4 {
    right: 125px;
    top: 80px;
    transform: rotate(-25deg);
}


/* OGGETTI */

.object {
    position: absolute;
    z-index: 8;
    user-select: none;
    -webkit-user-select: none;
    cursor: pointer;
    touch-action: manipulation;
    transition: transform .15s ease;
}

.object:active {
    transform: scale(.94);
}

.object img {
    width: 100%;
    height: auto;
    display: block;
    pointer-events: none;
}


/* POSIZIONI OGGETTI */

.hammock {
    left: 20px;
    top: 145px;
    width: 115px;
}

.hideout {
    right: 18px;
    bottom: 55px;
    width: 95px;
}

.plant {
    left: 25px;
    bottom: 45px;
    width: 60px;
}

.ball {
    right: 105px;
    bottom: 35px;
    width: 40px;
}

.food {
    left: 145px;
    bottom: 32px;
    width: 38px;
}


/* SANDRINA */

.sandrine {
    position: absolute;

    width: 85px;
    height: 85px;

    left: 50%;
    top: 50%;

    transform: translate(-50%, -50%);

    z-index: 20;

    cursor: grab;

    touch-action: none;

    user-select: none;
    -webkit-user-select: none;

    transition:
        left .15s linear,
        top .15s linear;
}

.sandrine img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: block;
    pointer-events: none;
}


/* ANIMAZIONI */

.sandrine.idle {
    animation: breathe 2.2s ease-in-out infinite;
}

.sandrine.walking {
    animation: walkBounce .36s ease-in-out infinite alternate;
}

.sandrine.cuddle {
    animation: cuddle .5s ease-in-out infinite alternate;
}

.sandrine.sleepy {
    animation: sleepy 1s ease-in-out infinite alternate;
}

.sandrine.clean {
    animation: cleanBounce .35s ease-in-out infinite alternate;
}

.sandrine.playing {
    animation: playing .4s ease-in-out infinite alternate;
}

.sandrine.eating {
    animation: eating .35s ease-in-out infinite alternate;
}

.sandrine.hiding {
    animation: hiding .7s ease-in-out infinite alternate;
}

.sandrine.exploring {
    animation: exploring .6s ease-in-out infinite alternate;
}

.sandrine.dragging {
    animation: none !important;
    transition: none !important;
    cursor: grabbing;
    z-index: 100;
}


/* KEYFRAMES */

@keyframes breathe {

    0%,100% {
        transform: translate(-50%, -50%) scale(1);
    }

    50% {
        transform: translate(-50%, -53%) scale(1.025);
    }
}

@keyframes walkBounce {

    from {
        margin-top: 0;
    }

    to {
        margin-top: -5px;
    }
}

@keyframes cuddle {

    from {
        transform: translate(0,0) scale(1);
    }

    to {
        transform: translate(0,0) scale(1.12);
    }
}

@keyframes sleepy {

    from {
        transform: translate(0,0) scale(1);
    }

    to {
        transform: translate(0,5px) scale(.95);
    }
}

@keyframes cleanBounce {

    from {
        transform: translate(0,0) rotate(-5deg);
    }

    to {
        transform: translate(0,0) rotate(5deg);
    }
}

@keyframes playing {

    from {
        transform: translate(0,0) rotate(-6deg) scale(1);
    }

    to {
        transform: translate(0,-7px) rotate(6deg) scale(1.05);
    }
}

@keyframes eating {

    from {
        transform: translate(0,0) scale(1);
    }

    to {
        transform: translate(0,2px) scale(.95);
    }
}

@keyframes hiding {

    from {
        transform: translate(0,0) scale(1);
    }

    to {
        transform: translate(8px,0) scale(.85);
    }
}

@keyframes exploring {

    from {
        transform: translate(0,0) rotate(-4deg);
    }

    to {
        transform: translate(0,-4px) rotate(4deg);
    }
}


/* SPEECH */

.speech {
    min-height: 50px;

    margin: 12px 12px 5px;

    padding: 13px 15px;

    background: #f7efe3;

    border-radius: 17px;

    text-align: center;

    font-size: 14px;

    font-weight: 600;

    color: #665243;
}

.status {
    text-align: center;

    min-height: 20px;

    padding: 2px 15px 7px;

    font-size: 11px;

    color: #9a806a;
}


/* PULSANTI */

.actions {
    display: grid;

    grid-template-columns: repeat(5,1fr);

    gap: 6px;

    padding: 5px 12px 10px;
}

.action {
    border: none;

    border-radius: 14px;

    padding: 10px 2px;

    font-size: 10px;

    font-weight: 800;

    color: white;

    cursor: pointer;

    box-shadow: 0 3px 0 rgba(0,0,0,.12);
}

.action:active {
    transform: translateY(3px);
    box-shadow: none;
}

.feed-button {
    background: #d99a55;
}

.play-button {
    background: #76a85d;
}

.cuddle-button {
    background: #d47d9d;
}

.sleep-button {
    background: #7f83b8;
}

.clean-button {
    background: #70b5cc;
}


/* DIARIO */

.diary {
    margin: 4px 12px 20px;

    padding: 12px;

    background: #faf4eb;

    border-radius: 17px;
}

.diary-title {
    font-size: 12px;

    font-weight: 800;

    margin-bottom: 7px;

    color: #735d4a;
}

.diary-list {
    max-height: 115px;

    overflow-y: auto;
}

.diary-entry {
    font-size: 10px;

    color: #8f7864;

    padding: 4px 0;

    border-bottom:
        1px solid
        rgba(130,100,70,.08);
}


/* EFFETTI */

.effect {
    position: absolute;

    z-index: 50;

    font-size: 30px;

    pointer-events: none;

    animation:
        effectPop
        1s
        ease
        forwards;
}

@keyframes effectPop {

    0% {
        opacity: 0;

        transform:
            translateY(15px)
            scale(.4);
    }

    25% {
        opacity: 1;

        transform:
            translateY(0)
            scale(1.15);
    }

    100% {
        opacity: 0;

        transform:
            translateY(-45px)
            scale(.8);
    }
}


/* MOBILE */

@media (max-width: 360px) {

    .room {
        height: 370px;
    }

    .sandrine {
        width: 75px;
        height: 75px;
    }

    .action {
        font-size: 9px;
    }
}

</style>

</head>


<body>

<div class="app">


<header>

    <div>

        <div class="logo">
            Petaurino
        </div>

        <div class="subtitle">
            La piccola Sandrina
        </div>

    </div>

    <div style="font-size:24px;">
        🐾
    </div>

</header>


<!-- STATS -->

<div class="stats">

    <div class="stat">

        <div class="stat-icon">🍎</div>

        <div class="stat-name">
            Fame
        </div>

        <div
            class="stat-value"
            id="hungerValue"
        >
            80
        </div>

    </div>


    <div class="stat">

        <div class="stat-icon">❤️</div>

        <div class="stat-name">
            Felicità
        </div>

        <div
            class="stat-value"
            id="happinessValue"
        >
            90
        </div>

    </div>


    <div class="stat">

        <div class="stat-icon">⚡</div>

        <div class="stat-name">
            Energia
        </div>

        <div
            class="stat-value"
            id="energyValue"
        >
            70
        </div>

    </div>


    <div class="stat">

        <div class="stat-icon">🫧</div>

        <div class="stat-name">
            Pulizia
        </div>

        <div
            class="stat-value"
            id="cleanValue"
        >
            85
        </div>

    </div>

</div>


<!-- STANZA -->

<div
    class="room"
    id="room"
>

    <div class="branch one"></div>
    <div class="branch two"></div>

    <div class="leaf l1"></div>
    <div class="leaf l2"></div>
    <div class="leaf l3"></div>
    <div class="leaf l4"></div>


    <!-- AMACA -->

    <div
        class="object hammock"
        id="hammock"
    >

        <img
            src="images/hammock.png"
            alt="Amaca"
        >

    </div>


    <!-- RIFUGIO -->

    <div
        class="object hideout"
        id="hideout"
    >

        <img
            src="images/hideout.png"
            alt="Rifugio"
        >

    </div>


    <!-- PIANTA -->

    <div
        class="object plant"
        id="plant"
    >

        <img
            src="images/plant.png"
            alt="Pianta"
        >

    </div>


    <!-- PALLA -->

    <div
        class="object ball"
        id="ball"
    >

        <img
            src="images/ball.png"
            alt="Palla"
        >

    </div>


    <!-- CIBO -->

    <div
        class="object food"
        id="food"
    >

        <img
            src="images/food.png"
            alt="Cibo"
        >

    </div>


    <!-- SANDRINA -->

    <div
        class="sandrine idle"
        id="sandrine"
    >

        <img
            id="sandrineImage"
            src="images/sandrina-idle.png"
            alt="Sandrina"
        >

    </div>

</div>


<!-- DIALOGO -->

<div
    class="speech"
    id="speech"
>
    Ciao! Sono Sandrina.
</div>


<div
    class="status"
    id="status"
>
    Sandrina sta esplorando la stanza...
</div>


<!-- AZIONI -->

<div class="actions">

    <button
        class="action feed-button"
        onclick="feed()"
    >
        🍎<br>CIBO
    </button>

    <button
        class="action play-button"
        onclick="play()"
    >
        ⚽<br>GIOCA
    </button>

    <button
        class="action cuddle-button"
        onclick="cuddle()"
    >
        ❤️<br>COCCOLE
    </button>

    <button
        class="action sleep-button"
        onclick="sleep()"
    >
        💤<br>NANNA
    </button>

    <button
        class="action clean-button"
        onclick="cleanSandrina()"
    >
        🫧<br>PULISCI
    </button>

</div>


<!-- DIARIO -->

<div class="diary">

    <div class="diary-title">
        📖 Diario di Sandrina
    </div>

    <div
        class="diary-list"
        id="diaryList"
    ></div>

</div>


</div>


<script>


/* =====================================================
   STATO
===================================================== */

let game = {

    hunger: 80,
    happiness: 90,
    energy: 70,
    clean: 85,

    lastUpdate: Date.now(),

    diary: []

};


/* =====================================================
   ELEMENTI
===================================================== */

const sandrine =
    document.getElementById("sandrine");

const sandrineImage =
    document.getElementById("sandrineImage");

const room =
    document.getElementById("room");

const speech =
    document.getElementById("speech");

const statusText =
    document.getElementById("status");


/* =====================================================
   UTILITÀ
===================================================== */

function clamp(value) {

    return Math.max(
        0,
        Math.min(
            100,
            value
        )
    );

}


function saveGame() {

    game.lastUpdate =
        Date.now();

    localStorage.setItem(
        "petaurino",
        JSON.stringify(game)
    );

}


function setSpeech(text) {

    speech.textContent =
        text;

}


function setStatus(text) {

    statusText.textContent =
        text;

}


/* =====================================================
   CARICAMENTO
===================================================== */

function loadGame() {

    const saved =
        localStorage.getItem(
            "petaurino"
        );

    if (!saved) return;

    try {

        const data =
            JSON.parse(saved);

        game = {
            ...game,
            ...data
        };

    } catch(error) {

        console.log(
            "Errore nel salvataggio."
        );

    }

}


/* =====================================================
   UI
===================================================== */

function updateUI() {

    document.getElementById(
        "hungerValue"
    ).textContent =
        Math.round(game.hunger);


    document.getElementById(
        "happinessValue"
    ).textContent =
        Math.round(game.happiness);


    document.getElementById(
        "energyValue"
    ).textContent =
        Math.round(game.energy);


    document.getElementById(
        "cleanValue"
    ).textContent =
        Math.round(game.clean);


    updateStatus();

    updateDiary();

}


function updateStatus() {

    if (game.hunger < 20) {

        setStatus(
            "🍎 Sandrina ha parecchia fame."
        );

        return;
    }


    if (game.energy < 20) {

        setStatus(
            "💤 Sandrina è stanchissima."
        );

        return;
    }


    if (game.clean < 20) {

        setStatus(
            "🫧 Sandrina avrebbe bisogno di una pulita."
        );

        return;
    }


    if (game.happiness < 25) {

        setStatus(
            "❤️ Sandrina vuole attenzioni."
        );

        return;
    }


    setStatus(
        "Sandrina sta esplorando la stanza..."
    );

}


/* =====================================================
   DIARIO
===================================================== */

function addDiary(text) {

    const now =
        new Date();

    const time =
        now.toLocaleTimeString(
            "it-IT",
            {
                hour: "2-digit",
                minute: "2-digit"
            }
        );


    game.diary.unshift(
        `${time} — ${text}`
    );


    if (game.diary.length > 20) {

        game.diary =
            game.diary.slice(0,20);

    }


    updateDiary();

    saveGame();

}


function updateDiary() {

    const list =
        document.getElementById(
            "diaryList"
        );

    list.innerHTML = "";


    game.diary
        .slice(0,10)
        .forEach(entry => {

            const div =
                document.createElement(
                    "div"
                );

            div.className =
                "diary-entry";

            div.textContent =
                entry;

            list.appendChild(
                div
            );

        });

}


/* =====================================================
   EFFETTI
===================================================== */

function createEffect(
    emoji,
    x = null,
    y = null
) {

    const effect =
        document.createElement(
            "div"
        );

    effect.className =
        "effect";

    effect.textContent =
        emoji;


    if (x === null) {

        x =
            sandrine.offsetLeft +
            sandrine.offsetWidth / 2;

    }


    if (y === null) {

        y =
            sandrine.offsetTop;

    }


    effect.style.left =
        `${x}px`;

    effect.style.top =
        `${y}px`;


    room.appendChild(
        effect
    );


    setTimeout(
        () => effect.remove(),
        1000
    );

}


/* =====================================================
   CAMMINATA
===================================================== */

const walkFrames = [

    "images/sandrina-walk-1.png",
    "images/sandrina-walk-2.png",
    "images/sandrina-walk-3.png",
    "images/sandrina-walk-4.png"

];


let walkInterval = null;

let walkingTimeout = null;

let movingToObject = false;

let draggingSandrina = false;

let dragged = false;


function startWalkingAnimation() {

    stopWalkingAnimation();

    let frame = 0;


    walkInterval =
        setInterval(
            () => {

                sandrineImage.src =
                    walkFrames[frame];

                frame =
                    (frame + 1) %
                    walkFrames.length;

            },
            180
        );

}


function stopWalkingAnimation() {

    if (walkInterval) {

        clearInterval(
            walkInterval
        );

        walkInterval = null;

    }

}


function stopMovement() {

    stopWalkingAnimation();


    if (walkingTimeout) {

        clearTimeout(
            walkingTimeout
        );

        walkingTimeout = null;

    }


    movingToObject = false;

}


/* =====================================================
   CAMMINA VERSO UN OGGETTO
===================================================== */

function getObjectTarget(
    element,
    offsetX = 0,
    offsetY = 0
) {

    return {

        x:
            element.offsetLeft +
            (
                element.offsetWidth -
                sandrine.offsetWidth
            ) / 2 +
            offsetX,

        y:
            element.offsetTop +
            (
                element.offsetHeight -
                sandrine.offsetHeight
            ) / 2 +
            offsetY

    };

}


function walkTo(
    targetX,
    targetY,
    callback
) {

    stopMovement();

    movingToObject = true;


    const startX =
        sandrine.offsetLeft;

    const startY =
        sandrine.offsetTop;


    const dx =
        targetX - startX;

    const dy =
        targetY - startY;


    const distance =
        Math.sqrt(
            dx * dx +
            dy * dy
        );


    const direction =
        dx >= 0 ? 1 : -1;


    const duration =
        Math.max(
            900,
            Math.min(
                2800,
                distance * 7
            )
        );


    sandrine.className =
        "sandrine walking";


    sandrine.style.transform =
        `translate(0,0) scaleX(${direction})`;


    startWalkingAnimation();


    sandrine.style.transition =
        `left ${duration}ms linear, top ${duration}ms linear`;


    requestAnimationFrame(() => {

        sandrine.style.left =
            `${targetX}px`;

        sandrine.style.top =
            `${targetY}px`;

    });


    walkingTimeout =
        setTimeout(
            () => {

                stopWalkingAnimation();

                movingToObject = false;


                sandrine.style.transition =
                    "left .15s linear, top .15s linear";


                if (callback) {

                    callback();

                }

            },
            duration + 60
        );

}


/* =====================================================
   AMACA
===================================================== */

function goToHammock() {

    const hammock =
        document.getElementById(
            "hammock"
        );


    const target =
        getObjectTarget(
            hammock,
            0,
            -5
        );


    setSpeech(
        "Mmm... voglio andare sull'amaca."
    );


    setStatus(
        "💤 Sandrina sta andando sull'amaca..."
    );


    walkTo(
        target.x,
        target.y,
        () => {

            sandrine.className =
                "sandrine sleepy";


            sandrineImage.src =
                "images/sandrina-sleep.png";


            setSpeech(
                "Zzz... finalmente."
            );


            setStatus(
                "💤 Sandrina dorme sull'amaca."
            );


            createEffect(
                "💤",
                target.x + 25,
                target.y - 20
            );


            addDiary(
                "💤 Sandrina è andata sull'amaca."
            );

        }
    );

}


/* =====================================================
   RIFUGIO
===================================================== */

function goToHideout() {

    const hideout =
        document.getElementById(
            "hideout"
        );


    const target =
        getObjectTarget(
            hideout,
            0,
            5
        );


    setSpeech(
        "Vado a nascondermi!"
    );


    setStatus(
        "🙈 Sandrina sta andando nel rifugio."
    );


    walkTo(
        target.x,
        target.y,
        () => {

            sandrine.className =
                "sandrine hiding";


            sandrineImage.src =
                "images/sandrina-hide.png";


            setSpeech(
                "Non mi trovi."
            );


            setStatus(
                "🙈 Sandrina si è nascosta."
            );


            createEffect(
                "❓",
                target.x + 25,
                target.y - 20
            );


            addDiary(
                "🙈 Sandrina si è nascosta."
            );

        }
    );

}


/* =====================================================
   PALLA
===================================================== */

function goToBall() {

    if (game.energy < 10) {

        setSpeech(
            "Vorrei giocare... ma sono cotta."
        );

        setStatus(
            "💤 Sandrina è troppo stanca."
        );

        return;

    }


    const ball =
        document.getElementById(
            "ball"
        );


    const target =
        getObjectTarget(
            ball,
            0,
            -10
        );


    setSpeech(

/* =====================================================
   TRASCINAMENTO
===================================================== */

let dragOffsetX = 0;

let dragOffsetY = 0;


sandrine.addEventListener(
    "pointerdown",
    startDrag
);


document.addEventListener(
    "pointermove",
    dragSandrina,
    {
        passive: false
    }
);


document.addEventListener(
    "pointerup",
    endDrag
);


function startDrag(e) {

    e.preventDefault();


    draggingSandrina =
        true;

    dragged =
        false;


    stopMovement();


    const rect =
        sandrine.getBoundingClientRect();


    dragOffsetX =
        e.clientX -
        rect.left;


    dragOffsetY =
        e.clientY -
        rect.top;


    sandrine.classList.add(
        "dragging"
    );


    if (
        sandrine.setPointerCapture
    ) {

        try {

            sandrine.setPointerCapture(
                e.pointerId
            );

        } catch(error) {}

    }

}


function dragSandrina(e) {

    if (!draggingSandrina) {

        return;
    }


    e.preventDefault();


    dragged =
        true;


    const roomRect =
        room.getBoundingClientRect();


    let x =
        e.clientX -
        roomRect.left -
        dragOffsetX;


    let y =
        e.clientY -
        roomRect.top -
        dragOffsetY;


    const maxX =
        room.clientWidth -
        sandrine.offsetWidth;


    const maxY =
        room.clientHeight -
        sandrine.offsetHeight;


    x =
        Math.max(
            0,
            Math.min(
                maxX,
                x
            )
        );


    y =
        Math.max(
            0,
            Math.min(
                maxY,
                y
            )
        );


    sandrine.style.transition =
        "none";


    sandrine.style.left =
        `${x}px`;

    sandrine.style.top =
        `${y}px`;

    sandrine.style.transform =
        "translate(0,0)";


    sandrineImage.src =
        "images/sandrina-idle.png";

}


function endDrag() {

    if (!draggingSandrina) {

        return;
    }


    draggingSandrina =
        false;


    sandrine.classList.remove(
        "dragging"
    );


    sandrine.style.transition =
        "left .15s linear, top .15s linear";


    if (dragged) {

        setSpeech(
            "Ehi! Mi hai spostata!"
        );


        setStatus(
            "👆 Sandrina è stata spostata."
        );


        createEffect(
            "✨",
            sandrine.offsetLeft + 25,
            sandrine.offsetTop - 10
        );


        saveGame();


        setTimeout(
            () => {

                if (!draggingSandrina) {

                    sandrine.className =
                        "sandrine idle";

                    sandrineImage.src =
                        "images/sandrina-idle.png";

                }

            },
            600
        );
        setTimeout(
    () => {
        if (!draggingSandrina && !movingToObject) {
            moveSandrina();
        }
    },
    1800
);

    }

}

/* =====================================================
   MOVIMENTO AUTONOMO
===================================================== */

function moveSandrina() {

    if (
        draggingSandrina ||
        movingToObject
    ) {

        return;
    }


    stopWalkingAnimation();


    const roomWidth =
        room.clientWidth;


    const roomHeight =
        room.clientHeight;


    const sandrinaWidth =
        sandrine.offsetWidth;


    const sandrinaHeight =
        sandrine.offsetHeight;


    const marginX = 15;

    const marginY = 30;


    const maxX =
        roomWidth -
        sandrinaWidth -
        marginX;


    const maxY =
        roomHeight -
        sandrinaHeight -
        marginY;


    const x =
        marginX +
        Math.random() *
        Math.max(
            1,
            maxX - marginX
        );


    const y =
        marginY +
        Math.random() *
        Math.max(
            1,
            maxY - marginY
        );


    const currentX =
        sandrine.offsetLeft;


    const direction =
        x >= currentX
            ? 1
            : -1;


    const distance =
        Math.sqrt(
            Math.pow(
                x - currentX,
                2
            ) +
            Math.pow(
                y - sandrine.offsetTop,
                2
            )
        );


    const duration =
        Math.max(
            1400,
            Math.min(
                3500,
                distance * 7
            )
        );


    sandrine.className =
        "sandrine walking";


    sandrine.style.transform =
        `translate(0,0) scaleX(${direction})`;


    startWalkingAnimation();


    sandrine.style.transition =
        `left ${duration}ms linear, top ${duration}ms linear`;


    requestAnimationFrame(
        () => {

            sandrine.style.left =
                `${x}px`;

            sandrine.style.top =
                `${y}px`;

        }
    );


    walkingTimeout =
        setTimeout(
            () => {

                stopWalkingAnimation();


                if (
                    !draggingSandrina &&
                    !movingToObject
                ) {

                    sandrine.className =
                        "sandrine idle";


                    sandrineImage.src =
                        "images/sandrina-idle.png";

                }


                const pause =
                    1800 +
                    Math.random() *
                    4500;


                walkingTimeout =
                    setTimeout(
                        moveSandrina,
                        pause
                    );

            },
            duration + 50
        );

}

/* =====================================================
   TEMPO
===================================================== */

function updateTime() {

    const now =
        Date.now();


    const elapsed =
        now -
        game.lastUpdate;


    const tenMinutes =
        10 * 60 * 1000;


    if (
        elapsed <
        tenMinutes
    ) {

        return;
    }


    const periods =
        Math.floor(
            elapsed /
            tenMinutes
        );


    game.hunger =
        clamp(
            game.hunger -
            periods
        );


    game.happiness =
        clamp(
            game.happiness -
            periods * .5
        );


    game.energy =
        clamp(
            game.energy -
            periods * .5
        );


    game.clean =
        clamp(
            game.clean -
            periods
        );


    game.lastUpdate =
        now;


    saveGame();

    updateUI();

}


/* =====================================================
   AVVIO
===================================================== */

loadGame();

updateTime();

updateUI();


setTimeout(
    () => {

        moveSandrina();

    },
    1800
);


setInterval(
    updateTime,
    2 * 60 * 1000
);


setInterval(
    () => {

        if (
            Math.random() <
            .35
        ) {

            randomEvent();

        }

    },
    45000
);
